name: Publish Hermes Windows generation barrier

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: hermes-windows-generation-publisher
  cancel-in-progress: false

jobs:
  materialize:
    name: Compose and publish exact source
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.ARES_REVIEW_TOKEN }}
    outputs:
      head_sha: ${{ steps.publish.outputs.head_sha }}
      pr_number: ${{ steps.publish.outputs.pr_number }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'
      - name: Compose, test, publish, and reconcile topology
        id: publish
        run: python scripts/publish_hermes_windows_generation.py

  windows-verify:
    name: Verify exact published head on Windows
    needs: materialize
    if: needs.materialize.outputs.head_sha != ''
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ secrets.ARES_REVIEW_TOKEN }}
      HEAD_SHA: ${{ needs.materialize.outputs.head_sha }}
      PR_NUMBER: ${{ needs.materialize.outputs.pr_number }}
    steps:
      - name: Check out exact published head
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/andrexibiza/hermes-agent.git C:/hermes
          cd C:/hermes
          git checkout --detach "${HEAD_SHA}"
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
      - name: Run native-Windows exact-head gates
        shell: bash
        run: |
          set -euo pipefail
          cd C:/hermes
          python -m pip install --disable-pip-version-check -q pytest==9.1.1 psutil==7.2.2 python-dotenv==1.2.2 pyyaml==6.0.3 ruff==0.15.10
          python -m py_compile hermes_cli/update_cmd.py hermes_cli/update_generation.py hermes_cli/update_generation_worker.py hermes_cli/update_lock.py hermes_cli/update_receipt.py tests/hermes_cli/test_update_gateway_runtime_intent.py tests/hermes_cli/test_update_generation.py tests/hermes_cli/test_update_lock.py tests/hermes_cli/test_update_receipt.py
          python -m ruff check hermes_cli/update_cmd.py hermes_cli/update_generation.py hermes_cli/update_generation_worker.py hermes_cli/update_lock.py tests/hermes_cli/test_update_gateway_runtime_intent.py tests/hermes_cli/test_update_generation.py tests/hermes_cli/test_update_lock.py
          HERMES_PYTHON="$(command -v python)" scripts/run_tests.sh tests/hermes_cli/test_update_gateway_runtime_intent.py tests/hermes_cli/test_update_generation.py tests/hermes_cli/test_update_lock.py tests/hermes_cli/test_update_receipt.py -q
          python scripts/check-windows-footguns.py hermes_cli/update_cmd.py hermes_cli/update_generation.py hermes_cli/update_generation_worker.py hermes_cli/update_lock.py tests/hermes_cli/test_update_gateway_runtime_intent.py tests/hermes_cli/test_update_generation.py tests/hermes_cli/test_update_lock.py
      - name: Post native-Windows receipt
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "${PR_NUMBER}" --repo NousResearch/hermes-agent --body "Native Windows exact-head verification passed for \`${HEAD_SHA}\` in [run ${GITHUB_RUN_ID}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}). Receipt covers generation, lock, update-receipt, stopped-gateway intent, compile, Ruff, and Windows-footgun gates. Upstream CI/Docker/Nix remain independently required."
